<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Linux Lab">
<meta name="theme-color" content="#0b0f14">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Linux Lab</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="top">
    <div class="brand"><span class="logo">&gt;_</span> Linux Lab</div>
    <div class="stats">
      <span id="streak" title="Seri">🔥 0</span>
      <span id="level" class="lvl">Lv 1</span>
    </div>
    <div class="xpbar"><div id="xpfill"></div></div>
  </header>

  <main id="views">
    <section id="v-home" class="view active"></section>
    <section id="v-chapter" class="view"></section>
    <section id="v-term" class="view">
      <div id="mcard" class="mcard hidden"></div>
      <div id="term" class="term" aria-live="polite"></div>
      <div id="keys" class="keys">
        <button data-k="TAB">Tab</button><button data-k="UP">↑</button><button data-k="DOWN">↓</button>
        <button data-k="|">|</button><button data-k="-">-</button><button data-k="/">/</button><button data-k="~">~</button>
        <button data-k=">">&gt;</button><button data-k="*">*</button><button data-k="$">$</button><button data-k="'">'</button><button data-k='"'>"</button>
        <button data-k="CLEAR">clear</button>
      </div>
      <form id="cmdform" class="cmdline" autocomplete="off">
        <span id="prompt" class="prompt"></span>
        <input id="cmd" type="text" autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="off" enterkeyhint="go" aria-label="Komut">
      </form>
    </section>
    <section id="v-quiz" class="view"></section>
    <section id="v-man" class="view"></section>
    <section id="v-me" class="view"></section>
  </main>

  <nav id="tabs">
    <button data-v="home" class="on"><span>🗺️</span>Görevler</button>
    <button data-v="term"><span>⌨️</span>Terminal</button>
    <button data-v="quiz"><span>🎯</span>Quiz</button>
    <button data-v="man"><span>📚</span>Sözlük</button>
    <button data-v="me"><span>👤</span>Profil</button>
  </nav>
</div>

<div id="editor" class="modal hidden">
  <div class="ed-head"><span id="ed-title">nano</span><span class="ed-actions"><button id="ed-cancel" class="ghost">İptal</button><button id="ed-save">Kaydet</button></span></div>
  <textarea id="ed-text" autocapitalize="none" autocorrect="off" spellcheck="false"></textarea>
  <div class="ed-foot">^O Kaydet &nbsp; ^X Çık &nbsp; burada butonları kullan</div>
</div>

<div id="vim" class="modal hidden">
  <div class="ed-head"><span id="vim-title">vim</span><span class="ed-actions"><button class="ghost" data-k=":,q,!,Enter" id="vim-quit">:q!</button><button data-k=":,w,q,Enter" id="vim-wq">:wq</button></span></div>
  <pre id="vim-screen" class="vim-screen"></pre>
  <div id="vim-status" class="vim-status"></div>
  <div id="vim-keys" class="keys">
    <button data-k="Escape">Esc</button><button data-k=":">:</button><button data-k="i">i</button><button data-k="o">o</button><button data-k="ArrowLeft">←</button><button data-k="ArrowDown">↓</button><button data-k="ArrowUp">↑</button><button data-k="ArrowRight">→</button><button data-k="d,d">dd</button><button data-k="y,y">yy</button><button data-k="p">p</button><button data-k="u">u</button><button data-k="x">x</button><button data-k="/">/</button><button data-k="G">G</button><button data-k="g,g">gg</button><button data-k="FOCUS">⌨️</button>
  </div>
  <input id="vim-in" class="vim-in" autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="off" aria-label="vim input">
</div>

<div id="toast" class="toast hidden"></div>
<div id="celebrate" class="celebrate hidden"></div>

<script src="shell.js"></script>
<script src="ext-net.js"></script>
<script src="ext-git.js"></script>
<script src="ext-vim.js"></script>
<script src="missions.js"></script>
<script src="missions-net.js"></script>
<script src="missions-git.js"></script>
<script src="missions-script.js"></script>
<script src="app.js"></script>
</body>
</html>
